<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepDetect AI - Geçmiş Taramalar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: '#0b0f19',
                        panel: '#111827',
                        neon: '#0ea5e9',
                        danger: '#ef4444',
                        safe: '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber text-gray-300 h-screen flex font-sans overflow-hidden">

    <aside class="w-64 bg-panel border-r border-gray-800 flex flex-col justify-between">
        <div>
            <div class="p-6 border-b border-gray-800">
                <h1 class="text-xl font-bold text-white tracking-wider">
                    <i class="fa-solid fa-microchip text-neon mr-2"></i>DeepFake</span>
                </h1>
            </div>
            
            <nav class="p-4 space-y-2">
                <a href="index.html" class="flex items-center space-x-3 p-3 hover:bg-gray-800/30 text-gray-400 hover:text-white rounded-lg transition">
                    <i class="fa-solid fa-radar-border"></i>
                    <span class="font-medium">Canlı Analiz</span>
                </a>
                <a href="history.html" class="flex items-center space-x-3 p-3 bg-gray-800/50 text-neon rounded-lg border border-gray-700">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span class="font-medium">Geçmiş Taramalar</span>
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-gray-800">
            <div class="flex items-center mb-4 px-3">
                <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center mr-3 border border-gray-600">
                    <i class="fa-solid fa-user-astronaut text-gray-400 text-sm"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-gray-300">Admin</p>
                    <p class="text-xs text-gray-500 font-mono">ID: 1220606045</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-white">Analiz Arşivi</h2>
                <p class="text-sm text-gray-400 mt-1">Sistem tarafından daha önce analiz edilmiş tüm medyalara ait log kayıtları.</p>
            </div>
            
            <div class="flex space-x-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-500 text-sm"></i>
                    <input type="text" placeholder="Dosya adı veya ID ara..." class="bg-gray-900 border border-gray-700 text-white text-sm rounded-lg focus:ring-neon focus:border-neon block w-64 pl-9 p-2.5">
                </div>
                <button class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white p-2.5 rounded-lg transition">
                    <i class="fa-solid fa-filter"></i>
                </button>
            </div>
        </header>

        <div class="bg-panel rounded-xl border border-gray-800 overflow-hidden shadow-2xl">
            <table class="w-full text-left text-sm text-gray-400">
                <thead class="text-xs text-gray-500 uppercase bg-gray-900/50 border-b border-gray-800 font-mono">
                    <tr>
                        <th scope="col" class="px-6 py-4">Tarama ID</th>
                        <th scope="col" class="px-6 py-4">Dosya Adı</th>
                        <th scope="col" class="px-6 py-4">Tarih / Saat</th>
                        <th scope="col" class="px-6 py-4">Analiz Sonucu</th>
                        <th scope="col" class="px-6 py-4">Güven Skoru</th>
                        <th scope="col" class="px-6 py-4 text-center">İşlem</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- JavaScript ile dinamik olarak doldurulacaktır -->
                </tbody>
            </table>
            
            <div class="p-4 border-t border-gray-800 flex justify-between items-center text-sm text-gray-500">
                <span id="totalCountText">Kayıtlar yükleniyor...</span>
                <div class="flex space-x-2" id="paginationControls">
                    <!-- Dinamik pagination butonları buraya gelecek -->
                </div>
            </div>
        </div>

    </main>

    <!-- Rapor Modal -->
    <div id="reportModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-panel border border-gray-700 rounded-xl max-w-2xl w-full p-6 relative shadow-2xl">
            <button onclick="closeReportModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-4 border-b border-gray-700 pb-2">
                <i class="fa-solid fa-file-pdf text-indigo-500 mr-2"></i>Analiz Raporu
            </h3>
            <div id="modalReportContent" class="text-sm text-gray-300 font-mono whitespace-pre-wrap max-h-[60vh] overflow-y-auto bg-gray-900 border border-gray-800 p-4 rounded">
                Yükleniyor...
            </div>
            <div class="mt-4 flex justify-end">
                <button onclick="closeReportModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition">Kapat</button>
            </div>
        </div>
    </div>

    <script>
        let allHistoryData = [];
        let currentPage = 1;
        const itemsPerPage = 5;

        document.addEventListener('DOMContentLoaded', loadHistory);

        async function loadHistory() {
            const tbody = document.getElementById('historyTableBody');
            const totalText = document.getElementById('totalCountText');
            tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Kayıtlar sunucudan yükleniyor...</td></tr>';
            
            try {
                const response = await fetch('http://localhost:8080/api/scan-history/list');
                const data = await response.json();
                
                allHistoryData = data.reverse(); // Yeni olanlar en başta
                renderTable();
                
            } catch(err) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-red-500"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Kayıtlar yüklenemedi. Spring Boot sunucusunun çalıştığından emin olun.</td></tr>`;
                totalText.innerText = "Bağlantı hatası.";
                document.getElementById('paginationControls').innerHTML = ''; // Hata durumunda sayfalamayı gizle
            }
        }

        function renderTable() {
            const tbody = document.getElementById('historyTableBody');
            const totalText = document.getElementById('totalCountText');
            
            tbody.innerHTML = '';
            totalText.innerText = `Toplam ${allHistoryData.length} tarama kaydı bulundu.`;

            if(allHistoryData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-gray-500">Hiç kayıt bulunamadı.</td></tr>';
                renderPagination(1);
                return;
            }

            const totalPages = Math.ceil(allHistoryData.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = allHistoryData.slice(startIndex, endIndex);

            pageData.forEach(item => {
                const dateObj = new Date(item.createdAt);
                const dateStr = dateObj.toLocaleString('tr-TR', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
                
                let resultBadge = '';
                if(item.result === "DEEPFAKE") {
                    resultBadge = `<span class="bg-danger/10 text-danger border border-danger/30 text-xs font-bold px-2.5 py-1 rounded">DEEPFAKE</span>`;
                } else {
                    resultBadge = `<span class="bg-safe/10 text-safe border border-safe/30 text-xs font-bold px-2.5 py-1 rounded">ORİJİNAL</span>`;
                }

                let heatmapBtn = item.heatmapUrl ? 
                    `<a href="${item.heatmapUrl}" target="_blank" class="text-orange-500 hover:text-white transition ml-3" title="Isı Haritasını Göster"><i class="fa-solid fa-fire text-lg"></i></a>` 
                    : `<span class="text-gray-600 ml-3" title="Isı haritası yok"><i class="fa-solid fa-fire-extinguisher text-lg"></i></span>`;

                let reportBtn = `<button onclick="openHistoryReport(${item.id})" class="text-indigo-500 hover:text-indigo-400 transition ml-3" title="Raporu Gör"><i class="fa-solid fa-file-invoice text-lg"></i></button>`;

                const tr = document.createElement('tr');
                tr.className = "bg-panel border-b border-gray-800 hover:bg-gray-800/30 transition";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-mono text-gray-500">#SCN-${item.id}</td>
                    <td class="px-6 py-4 font-medium text-white flex items-center">
                        <i class="fa-solid fa-file-video text-gray-500 mr-3 text-lg"></i> ${item.fileName}
                    </td>
                    <td class="px-6 py-4 text-gray-400">${dateStr}</td>
                    <td class="px-6 py-4">${resultBadge}</td>
                    <td class="px-6 py-4 text-white font-mono font-bold">%${item.confidenceScore}</td>
                    <td class="px-6 py-4 text-center">
                        ${reportBtn}
                        ${heatmapBtn}
                        <button onclick="deleteHistory(${item.id})" class="text-gray-500 hover:text-danger transition ml-4" title="Kaydı Sil"><i class="fa-solid fa-trash text-lg"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const paginationContainer = document.getElementById('paginationControls');
            paginationContainer.innerHTML = '';
            
            if (totalPages <= 1) return; // 1 sayfadan az ise ekstra sayfalama gösterme

            // Önceki
            const prevBtn = document.createElement('button');
            prevBtn.className = "px-3 py-1 rounded transition " + (currentPage === 1 ? "bg-gray-800 text-gray-600 cursor-not-allowed" : "bg-gray-900 border border-gray-700 hover:text-white");
            prevBtn.innerText = "Önceki";
            prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; renderTable(); } };
            paginationContainer.appendChild(prevBtn);

            // Sayı tuşları
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                if (i === currentPage) {
                    pageBtn.className = "px-3 py-1 bg-neon/20 border border-neon/50 text-neon rounded";
                } else {
                    pageBtn.className = "px-3 py-1 bg-gray-900 border border-gray-700 rounded hover:text-white transition";
                }
                pageBtn.innerText = i;
                pageBtn.onclick = () => { currentPage = i; renderTable(); };
                paginationContainer.appendChild(pageBtn);
            }

            // Sonraki
            const nextBtn = document.createElement('button');
            nextBtn.className = "px-3 py-1 rounded transition " + (currentPage === totalPages ? "bg-gray-800 text-gray-600 cursor-not-allowed" : "bg-gray-900 border border-gray-700 hover:text-white");
            nextBtn.innerText = "Sonraki";
            nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; renderTable(); } };
            paginationContainer.appendChild(nextBtn);
        }

        async function deleteHistory(id) {
            const isConfirmed = confirm('Bu kayıt kalıcı olarak silinecektir. Emin misiniz?');
            if(!isConfirmed) return;
            
            try {
                const res = await fetch(`http://localhost:8080/api/scan-history/delete/${id}`, { method: 'DELETE' });
                if(res.ok) {
                    loadHistory(); 
                } else {
                    alert("Silme işlemi sunucu tarafından reddedildi.");
                }
            } catch(err) {
                alert("Silme işlemi başarısız. Sunucu bağlantısını kontrol edin.");
            }
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportModal').classList.remove('flex');
        }

        async function openHistoryReport(id) {
            const modal = document.getElementById('reportModal');
            const content = document.getElementById('modalReportContent');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            const historyItem = allHistoryData.find(x => x.id === id);
            
            if (historyItem && historyItem.reportText) {
                // Rapor zaten veritabanında var, direkt göster
                content.innerText = historyItem.reportText;
                return;
            }

            // Yoksa oluştur
            content.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Rapor oluşturuluyor... Lütfen bekleyin.';
            
            try {
                const response = await fetch('http://localhost:8080/api/report/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        result: historyItem.result,
                        confidence: historyItem.confidenceScore,
                        heatmap_url: historyItem.heatmapUrl || "Bulunmuyor"
                    })
                });

                const data = await response.json();
                
                if (data.status === 'success') {
                    content.innerText = data.report_text;
                    
                    // Geçmişe kaydet (güncelle)
                    fetch(`http://localhost:8080/api/scan-history/update-report/${id}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ reportText: data.report_text })
                    }).then(() => {
                        if (historyItem) historyItem.reportText = data.report_text;
                    }).catch(e => console.error("Rapor güncellenemedi:", e));
                     
                } else {
                     content.innerText = "Rapor oluşturulamadı: Sunucu tarafında hata.";
                }
                
            } catch (e) {
                console.error("Rapor oluşturma hatası:", e);
                content.innerHTML = '<span class="text-red-500">Rapor oluşturulamadı: Sunucu bağlantı hatası</span>';
            }
        }
    </script>
</body>
</html>
