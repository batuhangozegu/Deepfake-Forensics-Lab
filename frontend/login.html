<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepDetect AI - Sistem Girişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: '#0b0f19',
                        panel: '#111827',
                        neon: '#0ea5e9',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-cyber text-gray-300 h-screen flex font-sans overflow-hidden">

    <div
        class="hidden lg:flex w-1/2 bg-panel relative flex-col justify-center items-center border-r border-gray-800 p-12">
        <div class="absolute inset-0 opacity-10"
            style="background-image: radial-gradient(#0ea5e9 1px, transparent 1px); background-size: 30px 30px;"></div>

        <div class="relative z-10 text-center">
            <i class="fa-solid fa-fingerprint text-7xl text-neon mb-6 drop-shadow-[0_0_15px_rgba(14,165,233,0.5)]"></i>
            <h1 class="text-4xl font-bold text-white tracking-wider mb-4">
                DeepFake - <span class="text-neon">Analiz Sistemi</span>
            </h1>
            <p class="text-gray-400 text-lg max-w-md mb-8">
                Derin Öğrenme Tabanlı Medya Doğrulama ve Manipülasyon Tespit Sistemi.
            </p>

            <div
                class="flex flex-col space-y-4 w-full max-w-md mx-auto bg-gray-900/50 border border-gray-700 rounded-xl p-6 backdrop-blur-sm shadow-2xl mt-4">
                <h3
                    class="text-sm text-gray-400 font-mono tracking-widest text-left mb-2 border-b border-gray-700 pb-3">
                    <i class="fa-solid fa-users-gear mr-2 text-lg"></i>Proje EKİBİ
                </h3>

                <div class="flex justify-between items-center mt-4">
                    <span class="text-white font-bold text-lg flex items-center">
                        <i class="fa-regular fa-circle-user text-neon mr-3 text-xl"></i>Batuhan Gözegü
                    </span>
                    <span
                        class="text-neon font-mono bg-blue-900/40 border border-blue-800 px-3 py-1.5 rounded-md text-sm font-bold tracking-wide shadow-inner">
                        ID: 1220606045
                    </span>
                </div>

                <div class="flex justify-between items-center pb-1">
                    <span class="text-white font-bold text-lg flex items-center">
                        <i class="fa-regular fa-circle-user text-neon mr-3 text-xl"></i>Sinan Türdü
                    </span>
                    <span
                        class="text-neon font-mono bg-blue-900/40 border border-blue-800 px-3 py-1.5 rounded-md text-sm font-bold tracking-wide shadow-inner">
                        ID: 1220606028
                    </span>
                </div>
            </div>

        </div>
    </div>
    </div>

    <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
        <div class="w-full max-w-md">
            <div class="mb-10">
                <h2 class="text-3xl font-bold text-white mb-2">Sisteme Erişim</h2>
                <p class="text-gray-500">Giriş Yapınız</p>
            </div>

            <form action="index.html" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">E-Posta</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-envelope text-gray-500"></i>
                        </div>
                        <input type="email" required
                            class="block w-full pl-10 pr-3 py-3 border border-gray-700 rounded-lg bg-gray-900 text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-neon focus:border-neon transition"
                            placeholder="admin@nku.edu.tr">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Şifre</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-500"></i>
                        </div>
                        <input type="password" required
                            class="block w-full pl-10 pr-3 py-3 border border-gray-700 rounded-lg bg-gray-900 text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-neon focus:border-neon transition"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between mt-4">
                    <div class="flex items-center">
                        <input type="checkbox"
                            class="h-4 w-4 text-neon focus:ring-neon border-gray-700 rounded bg-gray-900">
                        <label class="ml-2 block text-sm text-gray-400">Beni Hatırla</label>
                    </div>
                    <a href="#" class="text-sm text-neon hover:text-blue-400">Erişim kurtarma?</a>
                </div>

                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-neon hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-neon transition mt-6">
                    TERMİNALE GİRİŞ YAP <i class="fa-solid fa-arrow-right-to-bracket ml-2 mt-0.5"></i>
                </button>
            </form>
        </div>
    </div>

</body>

</html>
